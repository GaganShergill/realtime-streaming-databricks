bundle:
  name: realtime-streaming-databricks

# Define common settings here
variables:
  cluster_config:
    description: "Single Node job cluster"
    default:
      spark_version: 16.4.x-scala2.12
      node_type_id: Standard_D2ads_v6
      num_workers: 0  # Set workers to 0
      data_security_mode: SINGLE_USER
      single_user_name: reddragon0111@hotmail.com
      spark_conf:
        # This setting is required for Single Node clusters
        spark.databricks.cluster.profile: singleNode
        spark.master: local[*]
        spark.sql.files.ignoreMissingFiles: true
      custom_tags:
        ResourceClass: SingleNode

  catalog_name:
    description: "The name of the Unity Catalog to use"
    default: dev  # Default for local/dev runs

resources:
  jobs:
    ingestion_pipeline:
      name: "Ingestion Pipeline"
      job_clusters:
        - job_cluster_key: ingestion_cluster
          new_cluster: ${var.cluster_config}
      continuous:
        pause_status: UNPAUSED
      tasks:
        # ALWAYS ON - LOWEST RATE
        - task_key: streaming_ingest
          job_cluster_key: ingestion_cluster
          libraries:
            - maven:
                coordinates: "com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22"
          notebook_task:
            notebook_path: ./src/raw/1. Ingest the streaming data.ipynb

        # REUSING STREAMING CLUSTER - RUNS EVERY 30 SEC
        - task_key: micro_batch_ingest
          job_cluster_key: ingestion_cluster
          notebook_task:
            notebook_path: ./src/raw/2. Micro Batch Ingest the streaming blob data.ipynb

        # Batch Job - RUNS ONCE A DAY
        - task_key: batch_ingest
          job_cluster_key: ingestion_cluster
          notebook_task:
            notebook_path: ./src/raw/3. Batch Ingest the streaming blob data.ipynb

targets:
  # Development target (uses your dev workspace)
  dev:
    mode: development
    default: true
    variables:
      catalog_name: dev # Your dev catalog name

  # Production target (usually a separate workspace, but can be the same)
  prod:
    mode: production
    variables:
      catalog_name: prod # Your prod catalog name
