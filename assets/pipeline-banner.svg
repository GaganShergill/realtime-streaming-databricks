<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="Databricks medallion pipeline banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="110" fill="#ffffff" opacity="0.08"/>
  <circle cx="1260" cy="320" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="180" cy="340" r="130" fill="#ffffff" opacity="0.05"/>

  <text x="78" y="92" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" letter-spacing="4" opacity="0.78">REALTIME STREAMING DATABRICKS</text>
  <text x="78" y="166" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700">Event Hubs to Gold Tables</text>
  <text x="78" y="212" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Raw ingestion, bronze schema enforcement, silver cleanup, and gold analytics in one pipeline.</text>

  <g filter="url(#shadow)">
    <rect x="82" y="264" width="218" height="94" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="330" y="264" width="218" height="94" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="578" y="264" width="218" height="94" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="826" y="264" width="218" height="94" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="1074" y="264" width="218" height="94" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
  </g>

  <g fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="191" y="302" font-size="22" font-weight="700">Sources</text>
    <text x="439" y="302" font-size="22" font-weight="700">Raw</text>
    <text x="687" y="302" font-size="22" font-weight="700">Bronze</text>
    <text x="935" y="302" font-size="22" font-weight="700">Silver</text>
    <text x="1183" y="302" font-size="22" font-weight="700">Gold</text>

    <text x="191" y="330" font-size="16" opacity="0.88">Event Hubs + Blob</text>
    <text x="439" y="330" font-size="16" opacity="0.88">Delta landing tables</text>
    <text x="687" y="330" font-size="16" opacity="0.88">Typed schemas</text>
    <text x="935" y="330" font-size="16" opacity="0.88">Deduped records</text>
    <text x="1183" y="330" font-size="16" opacity="0.88">Business marts</text>
  </g>

  <g stroke="#dbeafe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <path d="M300 311 H326"/>
    <path d="M548 311 H574"/>
    <path d="M796 311 H822"/>
    <path d="M1044 311 H1070"/>
    <path d="M318 311 l-14 -10"/>
    <path d="M318 311 l-14 10"/>
    <path d="M566 311 l-14 -10"/>
    <path d="M566 311 l-14 10"/>
    <path d="M814 311 l-14 -10"/>
    <path d="M814 311 l-14 10"/>
    <path d="M1062 311 l-14 -10"/>
    <path d="M1062 311 l-14 10"/>
  </g>
</svg>
